# Overrides name template
nameOverride: ""
# Overrides fullname template
fullnameOverride: ""

# Docker registry fqdn used to pull fargocd images on every spoke.
registryFQDN: ghcr.io

# Manager image. Set tag to override the chart appVersion.
image: ghcr.io/appscode/fargocd
tag: ""
imagePullPolicy: Always

# OCM Placement selecting spoke clusters that receive the fargocd addon.
placement:
  create: true
  name: global

# Configuration propagated to every spoke's fargocd installation. The
# per-spoke clusterName is auto-populated from the ManagedCluster name.
argocd:
  # How fargocd on spoke clusters talks to Argo CD. One of:
  #   in-cluster, autonomous, managed
  mode: in-cluster
  # Namespace on the Argo CD cluster where Applications are written.
  # Auto-discovered when empty.
  namespace: ""
  # Left empty; fargocd's controller falls back to the in-cluster server
  # when both this and destName are empty. Must stay empty if destName is set.
  destServer: ""
  # Application.spec.destination.name. Set when Argo CD references the
  # workload cluster by symbolic name (typical in managed mode).
  destName: ""
  # Argo CD Project assigned to generated Applications.
  project: default
  # Raw kubeconfig for the Argo CD principal (managed mode); the manager
  # mounts it and propagates it to every spoke. Mutually exclusive with kubeconfigSecret.
  kubeconfig: ""
  # Name of an existing Secret (data key `kubeconfig`) holding the Argo CD
  # principal kubeconfig (managed mode). Mutually exclusive with argocd.kubeconfig.
  kubeconfigSecret: ""
  # Name of a pre-created Secret on each spoke holding the principal
  # kubeconfig, instead of the manager pushing the inline kubeconfig.
  kubeconfigSpokeSecret: ""

# Name of a Secret holding an OCM hub kubeconfig; when set, the manager
# uses --kubeconfig instead of the in-cluster ServiceAccount.
kubeconfigSecretName: ""

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  privileged: false
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

# List of sources to populate environment variables in the container
envFrom: []
# List of environment variables to set in the container
env: []

monitoring:
  # Name of monitoring agent (one of "prometheus.io", "prometheus.io/operator", "prometheus.io/builtin")
  agent: ""
  serviceMonitor:
    # Specify the labels for ServiceMonitor.
    # Prometheus crd will select ServiceMonitor using these labels.
    # Only usable when monitoring agent is `prometheus.io/operator`.
    labels: {}

distro:
  # Set true, if installed in OpenShift
  openshift: false
  # Set operator or all to use ubi images
  ubi: ""
