{{- if and .Values.agent.coordKubeconfigSecret .Values.agent.coordKubeconfigData }}
{{- /*
The coordination control plane credential, shipped by the addon manager so agents can
authenticate without anyone copying a Secret to each managed cluster by hand.

The control plane mints its own CAs into its data directory, so any rebuild or data-dir
loss produces a NEW CA and every previously distributed kubeconfig stops validating. That
used to require re-extracting the kubeconfig and applying it to every spoke manually, and
until someone did, the agents logged x509 errors forever without restarting. Rendering it
here means the rotated credential reaches every cluster on its own.

Only rendered when the addon manager could actually read the source; otherwise the chart
emits nothing and an operator provisioned Secret of the same name is used unchanged.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.agent.coordKubeconfigSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "dr.labels" . | nindent 4 }}
type: Opaque
data:
  kubeconfig: {{ .Values.agent.coordKubeconfigData }}
{{- end }}
