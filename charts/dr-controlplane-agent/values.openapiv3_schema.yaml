properties:
  addonInstallNamespace:
    type: string
  agent:
    properties:
      coordKubeconfigData:
        type: string
      coordKubeconfigSecret:
        type: string
      election:
        properties:
          leaseDurationSeconds:
            type: integer
          renewDeadlineSeconds:
            type: integer
          retryPeriodSeconds:
            type: integer
        required:
        - leaseDurationSeconds
        - renewDeadlineSeconds
        - retryPeriodSeconds
        type: object
      health:
        properties:
          leaseDurationSeconds:
            type: integer
          renewIntervalSeconds:
            type: integer
        required:
        - leaseDurationSeconds
        - renewIntervalSeconds
        type: object
      metricsAddr:
        type: string
      resources:
        description: ResourceRequirements describes the compute resource requirements.
        properties:
          claims:
            description: 'Claims lists the names of resources, defined in spec.resourceClaims,

              that are used by this container.


              This field depends on the

              DynamicResourceAllocation feature gate.


              This field is immutable. It can only be set for containers.'
            items:
              description: ResourceClaim references one entry in PodSpec.ResourceClaims.
              properties:
                name:
                  description: 'Name must match the name of one entry in pod.spec.resourceClaims
                    of

                    the Pod where this field is used. It makes that resource available

                    inside a container.'
                  type: string
                request:
                  description: 'Request is the name chosen for a request in the referenced
                    claim.

                    If empty, everything from the claim is made available, otherwise

                    only the result of this request.'
                  type: string
              required:
              - name
              type: object
            type: array
            x-kubernetes-list-map-keys:
            - name
            x-kubernetes-list-type: map
          limits:
            additionalProperties:
              anyOf:
              - type: integer
              - type: string
              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
              x-kubernetes-int-or-string: true
            description: 'Limits describes the maximum amount of compute resources
              allowed.

              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/'
            type: object
          requests:
            additionalProperties:
              anyOf:
              - type: integer
              - type: string
              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
              x-kubernetes-int-or-string: true
            description: 'Requests describes the minimum amount of compute resources
              required.

              If Requests is omitted for a container, it defaults to Limits if that
              is explicitly specified,

              otherwise to an implementation-defined value. Requests cannot exceed
              Limits.

              More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/'
            type: object
        type: object
    required:
    - election
    - health
    - metricsAddr
    type: object
  clusterName:
    type: string
  createNamespace:
    type: boolean
  image:
    properties:
      pullPolicy:
        type: string
      repository:
        type: string
      tag:
        type: string
    required:
    - pullPolicy
    - repository
    type: object
  imagePullSecrets:
    items:
      description: 'LocalObjectReference contains enough information to let you locate
        the

        referenced object inside the same namespace.'
      properties:
        name:
          default: ''
          description: 'Name of the referent.

            This field is effectively required, but due to backwards compatibility
            is

            allowed to be empty. Instances of this type with an empty value here are

            almost certainly wrong.

            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names'
          type: string
      type: object
      x-kubernetes-map-type: atomic
    type: array
  namespace:
    type: string
  nodeSelector:
    additionalProperties:
      type: string
    type: object
  replicas:
    type: integer
  tolerations:
    items:
      description: 'The pod this Toleration is attached to tolerates any taint that
        matches

        the triple <key,value,effect> using the matching operator <operator>.'
      properties:
        effect:
          description: 'Effect indicates the taint effect to match. Empty means match
            all taint effects.

            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.'
          type: string
        key:
          description: 'Key is the taint key that the toleration applies to. Empty
            means match all taint keys.

            If the key is empty, operator must be Exists; this combination means to
            match all values and all keys.'
          type: string
        operator:
          description: 'Operator represents a key''s relationship to the value.

            Valid operators are Exists and Equal. Defaults to Equal.

            Exists is equivalent to wildcard for value, so that a pod can

            tolerate all taints of a particular category.'
          type: string
        tolerationSeconds:
          description: 'TolerationSeconds represents the period of time the toleration
            (which must be

            of effect NoExecute, otherwise this field is ignored) tolerates the taint.
            By default,

            it is not set, which means tolerate the taint forever (do not evict).
            Zero and

            negative values will be treated as 0 (evict immediately) by the system.'
          format: int64
          type: integer
        value:
          description: 'Value is the taint value the toleration matches to.

            If the operator is Exists, the value should be empty, otherwise just a
            regular string.'
          type: string
      type: object
    type: array
required:
- agent
- createNamespace
- image
- namespace
- replicas
type: object
