apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: open-cluster-management:config-syncer:addon-manager
  labels:
    {{- include "config-syncer-manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:config-syncer:addon-manager
subjects:
  - kind: ServiceAccount
    name: config-syncer-manager
    namespace: {{ .Release.Namespace }}
