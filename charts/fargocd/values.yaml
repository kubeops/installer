# Default values for sidekick.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Overrides name template
nameOverride: ""
# Overrides fullname template
fullnameOverride: ""

replicaCount: 1

# Docker registry fqdn used to pull docker images
# Set this to use docker registry hosted at ${registryFQDN}/${registry}/${image}
registryFQDN: ghcr.io
image:
  # Docker registry used to pull operator image
  registry: appscode
  # Name of operator container image
  repository: fargocd
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Compute Resources required by the operator container
  resources: {}
  # Security options this container should run with
  securityContext: # +doc-gen:break
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

# Specify an array of imagePullSecrets.
# Secrets must be manually created in the namespace.
#
# Example:
# helm template charts/stash \
#   --set imagePullSecrets[0].name=sec0 \
#   --set imagePullSecrets[1].name=sec1
imagePullSecrets: []
# Container image pull policy
imagePullPolicy: Always
# If true, installs sidekick as critical addon
criticalAddon: false
# Log level for operator
logLevel: 3
# Annotations applied to operator deployment
annotations: {}
# Annotations passed to operator pod(s).
podAnnotations: {}
# Labels passed to operator pod(s)
podLabels: {}
# Node labels for pod assignment
nodeSelector: # +doc-gen:break
  kubernetes.io/os: linux

podSecurityContext: {}
  # fsGroup: 2000

tolerations: []

affinity: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

apiserver:
  # If true, mutating webhook is configured for sidekick CRDs
  enableMutatingWebhook: false
  # If true, validating webhook is configured for sidekick CRDs
  enableValidatingWebhook: false
  healthcheck:
    # If true, enables the readiness and liveliness probes for the operator pod.
    enabled: false
  servingCerts:
    # If true, generates on install/upgrade the certs that allow the kube-apiserver (and potentially ServiceMonitor)
    # to authenticate operators pods. Otherwise specify certs in `apiserver.servingCerts.{caCrt, serverCrt, serverKey}`.
    generate: true
    certManager:
      # If true, cert-manager is used to generate the serving certificate secret.
      enabled: false
      # issuerRef configures the cert-manager Issuer/ClusterIssuer. If name is empty, a self-signed Issuer is created.
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
    # CA certficate used by serving certificate of webhook server.
    caCrt: ""
    # Serving certficate used by webhook server.
    serverCrt: ""
    # Private key for the serving certificate used by webhook server.
    serverKey: ""
monitoring:
  # Name of monitoring agent (one of "prometheus.io", "prometheus.io/operator", "prometheus.io/builtin")
  agent: ""
  serviceMonitor:
    # Specify the labels for ServiceMonitor.
    # Prometheus crd will select ServiceMonitor using these labels.
    # Only usable when monitoring agent is `prometheus.io/operator`.
    labels: {}

networkPolicy:
  enabled: false

distro:
  # Set true, if installed in OpenShift
  openshift: false
  # Set operator or all to use ubi images
  ubi: ""

# Configuration for how the controller talks to Argo CD. Mirrors the flags
# exposed by `fargocd run`; see https://github.com/kubeops/fargocd.
argocd:
  # How fargocd talks to Argo CD: in-cluster (local), autonomous
  # (argocd-agent + headless Argo CD, installed by b3 not this chart), or managed (remote principal).
  mode: in-cluster
  # Namespace on the Argo CD cluster where Applications are written.
  # Auto-discovered when empty (Service labelled app.kubernetes.io/name=argocd-server).
  namespace: ""
  # Left empty; controller falls back to the in-cluster server when both
  # this and destName are empty. Must stay empty when destName is set.
  destServer: ""
  # Application.spec.destination.name. Set when Argo CD references the
  # workload cluster by symbolic name (typical in managed mode).
  destName: ""
  # Argo CD Project assigned to generated Applications.
  project: default
  # Symbolic name of the workload cluster. Required when argocd.mode=managed
  # -- suffixes Application names so one principal can serve many clusters.
  clusterName: ""
  # Name of an existing Secret (data key `kubeconfig`) holding the Argo CD
  # principal's kubeconfig. Required when argocd.mode=managed, unless argocd.kubeconfig is set.
  kubeconfigSecret: ""
  # Raw kubeconfig content for the Argo CD principal cluster; alternative
  # to kubeconfigSecret. e.g. --set-file argocd.kubeconfig=/path/to/kubeconfig
  kubeconfig: ""
