# Default values for cattleset.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Overrides name template
nameOverride: ""
# Overrides fullname template
fullnameOverride: ""
# Number of replicas to create. More than one turns on leader election: one
# replica reconciles, the others take over if it goes away. Run two or more for
# the hub controller.
replicaCount: 1

# Docker registry fqdn used to pull Stash related images.
# Set this to use docker registry hosted at ${registryFQDN}/${registry}/${image}
registryFQDN: ghcr.io
image:
  # Docker registry used to pull operator image
  registry: appscode
  # Name of operator container image
  repository: cattleset
  # Operator container image tag
  tag: ""
  # Compute Resources required by the operator container
  resources: # +doc-gen:break
    requests:
      cpu: "100m"
  # Security options this container should run with
  securityContext: # +doc-gen:break
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault

# Specify an array of imagePullSecrets.
# Secrets must be manually created in the namespace.
#
# Example:
# helm template charts/cattleset \
#   --set imagePullSecrets[0].name=sec0 \
#   --set imagePullSecrets[1].name=sec1
imagePullSecrets: []
# Container image pull policy
imagePullPolicy: IfNotPresent
# If true, installs cattleset as critical addon
criticalAddon: false
# Log level for operator
logLevel: 3
# Annotations applied to operator deployment
annotations: {}
# Annotations passed to operator pod(s).
podAnnotations: {}
# Labels passed to operator pod(s)
podLabels: {}
# Node labels for pod assignment
nodeSelector: # +doc-gen:break
  kubernetes.io/os: linux
# Tolerations for pod assignment
tolerations: []
# Affinity rules for pod assignment
affinity: {}
# Security options the operator pod should run with.
podSecurityContext: # +doc-gen:break
  fsGroup: 65535
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:
apiserver:
  # If true, mutating webhook is configured for cattleset CRDs
  enableMutatingWebhook: true
  # If true, validating webhook is configured for cattleset CRDs
  enableValidatingWebhook: true
  healthcheck:
    # If true, enables the readiness and liveliness probes for the operator pod.
    enabled: false
  servingCerts:
    # If true, generates on install/upgrade the certs that allow the kube-apiserver (and potentially ServiceMonitor)
    # to authenticate operators pods. Otherwise specify certs in `apiserver.servingCerts.{caCrt, serverCrt, serverKey}`.
    generate: true
    certManager:
      # If true, cert-manager is used to generate the serving certificate secret.
      enabled: false
      # issuerRef configures the cert-manager Issuer/ClusterIssuer. If name is empty, a self-signed Issuer is created.
      issuerRef:
        name: ""
        kind: Issuer
        group: cert-manager.io
    # CA certficate used by serving certificate of webhook server.
    caCrt: ""
    # Serving certficate used by webhook server.
    serverCrt: ""
    # Private key for the serving certificate used by webhook server.
    serverKey: ""
monitoring:
  # Name of monitoring agent (either "prometheus.io/operator" or "prometheus.io/builtin")
  agent: "none"
  serviceMonitor:
    # Specify the labels for ServiceMonitor.
    # Prometheus crd will select ServiceMonitor using these labels.
    # Only usable when monitoring agent is `prometheus.io/operator`.
    labels: {}

networkPolicy:
  enabled: false
  # flavor selects which network policy API is used.
  # Accepted values: "kubernetes" (default) or "cilium".
  flavor: kubernetes

distro:
  # Set true, if installed in OpenShift
  openshift: false
  # Set operator or all to use ubi images
  ubi: ""

features:
  ocm:
    enabled: false
    placement:
      create: true
      name: global

# The maximum number of concurrent reconciles which can be run
maxConcurrentReconciles: 0

# CattleSet has two roles, installed separately.
#
# The hub controller reconciles CattleSets, renders their ManifestWorks, takes part
# in FailoverGroup ordering and serves the admission webhooks. Install it once, on
# the OCM hub. It needs no write access to Leases.
hubController:
  enabled: true
  # The OCM managed cluster name of the cluster the hub controller runs in. When it
  # is not a Member of a herd (the stretched hub is the Arbiter DC and runs no
  # workloads), the herd's hub-local workload is retired instead of adopted.
  clusterName: ""
  # Set true when this hub is an Arbiter DC: a non-distributed CattleSet created on
  # it is warned about.
  arbiterHub: false

# The coordination control plane serves the primary DC and DC health Leases in
# dc-failover. The hub controller reads them (read only).
coordination:
  # Name of a Secret in the release namespace with a `kubeconfig` key for the
  # coordination control plane. Empty means the hub's own API server.
  kubeconfigSecret: ""

# The gate agent runs on EVERY Member spoke, with the hub controller off:
#
#   helm install cattleset-gate-agent charts/cattleset -n cattleset-system \
#     --set hubController.enabled=false \
#     --set gateAgent.enabled=true --set gateAgent.dcName=<this spoke's managed cluster name>
#
# It admits a herd's Service only while the databases the herd depends on are
# active and writable in this cluster, decided from local objects with no hub
# credential, and fails closed. dr-controlplane's agent must already be installed on
# the spoke: it creates the dc-failover namespace the markers live in.
gateAgent:
  enabled: false
  # This spoke's OCM managed cluster name: the DC name the scope markers carry in
  # activeDC. Required; an agent that does not know which DC it is would never admit.
  dcName: ""
  # How often a gated Service is re-evaluated.
  resync: 5s

# CattleSet consumes the PlacementPolicy and FailoverGroup CRDs, which are owned and
# installed by the petset chart. This chart deliberately does not ship a second copy
# of those CRDs; install charts/petset (or otherwise ensure they are present) before
# a distributed CattleSet is created.
requiresPlacementPolicyCRD: true
